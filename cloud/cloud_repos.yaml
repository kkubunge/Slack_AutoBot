# Slack_AutoBot 클라우드 무인 버전(GitHub Actions + Gemini API) 저장소 및 워크플로우 설정

default_repo: "slack_autobot"

gemini:
  default_model: "gemini-2.5-pro"
  fallback_models:
    - "gemini-2.5-pro"
    - "gemini-2.5-flash"
    - "gemini-3.5-flash"
    - "gemini-flash-latest"
  max_turns: 15

repos:
  slack_autobot:
    repo: "kkubunge/Slack_AutoBot"
    default_branch: "main"
    description: "AutoBot(오토봇) — 로컬·클라우드 AI 개발 컨트롤러"
  traillog:
    repo: "kkubunge/Instagram_TrailLog"
    default_branch: "main"
    description: "두루누비 인스타그램 카드뉴스 자동화"
  ondotrip:
    repo: "kkubunge/Google_OndoTrip"
    default_branch: "main"
    description: "공공데이터 기반 구글 블로그(OndoTrip) 자동 포스팅"

workflows:
  traillog:
    repo: "kkubunge/Instagram_TrailLog"
    workflow: "auto_publish.yml"
    ref: "main"
    inputs:
      brd: "걷기"
      style: "auto"
      dry_run: false
    description: "TrailLog 미게시 코스 카드뉴스 자동 게시 + Slack 보고"
  traillog-dryrun:
    repo: "kkubunge/Instagram_TrailLog"
    workflow: "auto_publish.yml"
    ref: "main"
    inputs:
      brd: "걷기"
      style: "auto"
      dry_run: true
    description: "TrailLog 카드뉴스 사전 검증(실제 게시 안 함) + Slack 보고"
  ondotrip:
    repo: "kkubunge/Google_OndoTrip"
    workflow: "daily_post.yml"
    ref: "main"
    inputs:
      count: "5"
      publish: true
      preview_only: false
      status_only: false
    description: "OndoTrip 일일 자동 공개 발행 5건 + Slack 보고"
  ondotrip-draft:
    repo: "kkubunge/Google_OndoTrip"
    workflow: "daily_post.yml"
    ref: "main"
    inputs:
      count: "5"
      publish: false
      preview_only: false
      status_only: false
    description: "OndoTrip 일일 포스팅 5건 임시저장(Draft) + Slack 보고"
  ondotrip-preview:
    repo: "kkubunge/Google_OndoTrip"
    workflow: "daily_post.yml"
    ref: "main"
    inputs:
      count: "1"
      publish: false
      preview_only: true
      status_only: false
    description: "OndoTrip HTML 미리보기 1건 생성 (업로드 없음)"
  ondotrip-status:
    repo: "kkubunge/Google_OndoTrip"
    workflow: "daily_post.yml"
    ref: "main"
    inputs:
      count: "1"
      publish: false
      preview_only: false
      status_only: true
    description: "OndoTrip 누적 현황(--status) 조회"
