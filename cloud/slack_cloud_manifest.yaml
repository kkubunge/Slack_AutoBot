display_information:
  name: Slack_AIbot Cloud
  description: Cloudflare Workers + GitHub Actions 기반 무인 AI 개발·워크플로우 제어 봇
  background_color: "#0d47a1"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Slack_AIbot
    always_online: true
  slash_commands:
    - command: /ai
      url: https://<your-worker>.workers.dev/slack/commands
      description: 클라우드 AI 개발 및 GitHub Actions 워크플로우 실행
      usage_hint: "[프로젝트] 지시내용 | !실행 traillog | !도움"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      - chat:write
      - reactions:write
      - commands
settings:
  event_subscriptions:
    request_url: https://<your-worker>.workers.dev/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
